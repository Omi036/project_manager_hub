<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gestor de proyectos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top">
        <div class="search_bar"><svg class="ti search_icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg><input type="search" id="project_search_input" placeholder="Buscar proyectos…" aria-label="Buscar proyectos" autocomplete="off"><div class="search_results" id="project_search_results" hidden></div></div>
        <button class="btn navigation_toggle" id="navigation_toggle_button" aria-label="Menú de navegación" aria-expanded="false">☰</button>
        <div class="main_navigation" id="main_navigation"><button class="btn icon" id="home_button" title="Lista de proyectos" aria-label="Lista de proyectos"><svg class="ti" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l11 0"/><path d="M9 12l11 0"/><path d="M9 18l11 0"/><path d="M5 6l0 .01"/><path d="M5 12l0 .01"/><path d="M5 18l0 .01"/></svg><span class="lbl-text">Lista de proyectos</span></button><button class="btn icon" id="news_button" title="Noticias" aria-label="Noticias"><svg class="ti" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1 -4 0v-13a1 1 0 0 0 -1 -1h-10a1 1 0 0 0 -1 1v12a3 3 0 0 0 3 3h11"/><path d="M8 8l4 0"/><path d="M8 12l4 0"/><path d="M8 16l4 0"/></svg><span class="lbl-text">Noticias</span></button>
        <button class="btn pri icon" id="new_project_button" title="Crear proyecto" aria-label="Crear proyecto"><svg class="ti" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg><span class="lbl-text">Crear proyecto</span></button></div>
        <button class="btn icon notifications_button" id="news_notifications_button" title="Novedades" aria-label="Novedades"><svg class="ti" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg><span class="dot" hidden></span></button>
        <div class="user_profile"><button class="user_avatar_button" id="user_avatar_button" aria-label="Menú de usuario" aria-haspopup="true" aria-expanded="false" title="Tu perfil"><span class="avatar">LM</span><svg class="ti" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
        <div class="user_menu" id="user_menu" hidden><button class="discord" data-login-discord>Iniciar sesión con Discord</button><button data-nav="mis-proyectos">Mis proyectos</button><button data-nav="mis-colaboraciones">Mis colaboraciones</button><button data-open-settings>Configuración</button><button class="out" data-logout>Cerrar sesión</button></div></div>
    </header>
    
    <main id="application"></main>

    <dialog id="project_dialog"><form id="project_form" method="dialog" novalidate></form></dialog>
    <dialog id="update_dialog"><form id="update_form" method="dialog" novalidate></form></dialog>
    <dialog id="discussion_dialog"><form id="discussion_form" method="dialog" novalidate></form></dialog>
    <dialog id="settings_dialog"><form id="settings_form" method="dialog" novalidate></form></dialog>
    <dialog id="news_dialog"><form id="news_form" method="dialog" novalidate></form></dialog>

    <script src="app-utils.js"></script>
    <script src="app-data.js"></script>
    <script src="app-projects.js"></script>
    <script src="app-discussions.js"></script>
    <script src="app-ui.js"></script>
</body>
</html>
